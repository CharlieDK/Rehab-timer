<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216"><title>Rehab Timer</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f8fafc;background:#101216;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}.screen{min-height:100svh;min-height:100dvh;max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;min-height:45px}.brand{font-weight:850;font-size:13px;letter-spacing:2px}.iconbtn{width:48px;height:48px;border:0;background:#242931;border-radius:14px;color:#fff;font-size:24px}.main{flex:1;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.phase{font-size:clamp(20px,5vw,26px);font-weight:850;letter-spacing:2px;color:var(--accent,#a4ff66);text-align:center}.digits{width:100%;text-align:center;white-space:nowrap;font-size:clamp(88px,25.5vw,175px);line-height:1.05;letter-spacing:-.075em;font-weight:800;font-variant-numeric:tabular-nums;font-feature-settings:'tnum';padding-right:.075em}.detail{color:#b0bac6;font-size:17px;font-weight:650;text-align:center}.progress{height:8px;background:#343941;border-radius:99px;overflow:hidden;width:100%;margin-top:16px}.bar{width:0;height:100%;background:var(--accent,#a4ff66);transition:width .1s linear}.foot{display:flex;flex-direction:column;gap:12px}.buttons{display:flex;gap:10px}.btn{border:0;border-radius:17px;min-height:68px;font-size:19px;font-weight:800}.primary{background:#a4ff66;color:#101510;flex:1}.secondary{background:#282e36;color:#f4f6f8;width:76px}.muted{color:#a7b0bd;font-size:13px;text-align:center;line-height:1.4}.settings{display:none;position:fixed;inset:0;background:#101216;overflow:auto;z-index:10}.settings.open{display:block}.settings-inner{max-width:650px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 25px)}.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.settings h1{font-size:27px;margin:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{background:#20262e;border-radius:18px;padding:16px 14px}.field label{display:block;color:#c9d2dd;font-size:15px;font-weight:700;margin-bottom:14px}.field input{background:#10151b;border:1px solid #475362;border-radius:12px;color:white;font-size:32px;font-weight:800;width:100%;padding:12px 6px;text-align:center;font-variant-numeric:tabular-nums}.unit{font-size:12px;color:#9da8b7;text-align:center;margin-top:6px}.option{display:flex;align-items:center;gap:12px;margin-top:24px;font-size:15px}.option input{width:22px;height:22px;accent-color:#a4ff66}.summary{margin-top:24px;color:#bdc7d2;line-height:1.5}.save{margin-top:26px;width:100%}.note{color:#9da8b7;font-size:12px;line-height:1.5;margin-top:20px}@media(max-height:680px){.main{min-height:230px;gap:6px}.digits{font-size:clamp(80px,23vw,155px)}.btn{min-height:58px}}@media(max-width:360px){.digits{font-size:24.5vw}.screen{padding-left:12px;padding-right:12px}}
@media (orientation:landscape) and (max-height:600px){
.screen{max-width:none;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 5px) calc(env(safe-area-inset-right) + 18px) calc(env(safe-area-inset-bottom) + 7px) calc(env(safe-area-inset-left) + 18px)}
.top{min-height:38px}.iconbtn{width:42px;height:42px;border-radius:11px;font-size:21px}
.main{min-height:0;gap:1px;justify-content:center}.phase{font-size:clamp(15px,3.5vh,22px)}
.digits{font-size:min(34vh,25vw,180px);line-height:1;letter-spacing:-.06em}
.detail{font-size:clamp(12px,3vh,17px)}.progress{margin-top:5px;height:5px}
.foot{gap:3px}.btn{min-height:42px;font-size:16px;border-radius:12px}.secondary{width:64px}.muted{display:none}
.settings-inner{max-width:720px}.settings-header{margin-bottom:15px}
}
</style></head><body><main class="screen" id="screen"><header class="top"><button class="iconbtn" id="settingsBtn" aria-label="Configurar">⚙</button><span class="brand">REHAB TIMER</span><button class="iconbtn" id="soundBtn" aria-label="Activar o desactivar sonido">♪</button></header><section class="main" aria-live="off"><div class="phase" id="phase">LISTO</div><div class="digits" id="digits">00:00</div><div class="detail" id="detail">Pulsa Iniciar</div><div class="progress"><div class="bar" id="bar"></div></div></section><footer class="foot"><div class="buttons"><button class="btn secondary" id="reset" aria-label="Reiniciar">↺</button><button class="btn primary" id="start">▶ Iniciar</button></div><div class="muted" id="footerInfo">Configura los tiempos desde ⚙</div></footer></main><section class="settings" id="settings" aria-label="Configuración"><div class="settings-inner"><header class="settings-header"><h1>Configurar sesión</h1><button class="iconbtn" id="closeSettings" aria-label="Cerrar">✕</button></header><div class="fields"><div class="field"><label for="prep">Preparación</label><input type="number" id="prep" min="0" max="3600" value="10" inputmode="numeric"><div class="unit">segundos</div></div><div class="field"><label for="work">Ejercicio</label><input type="number" id="work" min="1" max="3600" value="30" inputmode="numeric"><div class="unit">segundos</div></div><div class="field"><label for="rest">Descanso</label><input type="number" id="rest" min="0" max="3600" value="15" inputmode="numeric"><div class="unit">segundos</div></div><div class="field"><label for="reps">Repeticiones</label><input type="number" id="reps" min="1" max="999" value="5" inputmode="numeric"><div class="unit">ciclos</div></div></div><label class="option"><input type="checkbox" id="sound" checked> Avisos sonoros</label><label class="option"><input type="checkbox" id="awake" checked> Intentar mantener la pantalla encendida</label><div class="summary" id="summary"></div><button class="btn primary save" id="save">Guardar y volver</button><p class="note">Los ajustes se guardan en este dispositivo. En iPhone, el audio y la pantalla activa pueden dejar de funcionar si bloqueas el teléfono o cambias de aplicación.</p></div></section><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const keys=['prep','work','rest','reps'];const defaults={prep:10,work:30,rest:15,reps:5};let cfg=null,segments=[],idx=0,elapsed=0,running=false,startedAt=0,raf=0,audio=null,wake=null,lastRemaining=null,completed=false;const settings=$('settings');
try{const saved=JSON.parse(localStorage.getItem('rehab-timer')||'{}');for(const k of keys)if(Number.isFinite(saved[k]))$(k).value=saved[k];if(typeof saved.sound==='boolean')$('sound').checked=saved.sound;if(typeof saved.awake==='boolean')$('awake').checked=saved.awake}catch(e){}
function read(){const c={};for(const k of keys){const lo=k==='work'||k==='reps'?1:0,hi=k==='reps'?999:3600,v=Number($(k).value);c[k]=Math.max(lo,Math.min(hi,Number.isFinite(v)?Math.floor(v):defaults[k]));$(k).value=c[k]}return c}function persist(){try{localStorage.setItem('rehab-timer',JSON.stringify({...read(),sound:$('sound').checked,awake:$('awake').checked}))}catch(e){}}function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateSummary(){const c=read();$('summary').textContent='Duración total: '+fmt(c.prep+c.reps*(c.work+c.rest))+' · '+c.reps+' ejercicios y '+c.reps+' descansos'}
function ensureAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}function tone(freq=880,duration=.13,delay=0){if(!$('sound').checked)return;try{ensureAudio();if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+duration+.03)}catch(e){}}function finishSound(){tone(740,.13,0);tone(980,.13,.19);tone(1240,.4,.38)}
async function keepAwake(){if(!$('awake').checked||!('wakeLock'in navigator))return;try{wake=await navigator.wakeLock.request('screen')}catch(e){}}function releaseWake(){if(wake){wake.release().catch(()=>{});wake=null}}
function build(){cfg=read();segments=[];if(cfg.prep>0)segments.push({type:'prep',seconds:cfg.prep,round:0});for(let r=1;r<=cfg.reps;r++){segments.push({type:'work',seconds:cfg.work,round:r});if(cfg.rest>0)segments.push({type:'rest',seconds:cfg.rest,round:r})}idx=0;elapsed=0;lastRemaining=null;completed=false}
function current(){return segments[idx]||null}function display(){const seg=current();let type=completed?'done':seg?.type||'idle';const color={idle:'#a4ff66',prep:'#f9b64e',work:'#a4ff66',rest:'#69bfff',done:'#d3b0ff'}[type];document.documentElement.style.setProperty('--accent',color);$('phase').textContent={idle:'LISTO',prep:'PREPARACIÓN',work:'EJERCICIO',rest:'DESCANSO',done:'¡COMPLETADO!'}[type];let number=0;if(seg){number=seg.type==='work'?Math.min(seg.seconds,Math.floor(elapsed/1000)):Math.max(0,Math.ceil(seg.seconds-elapsed/1000))}else if(completed){number=0}$('digits').textContent=fmt(number);$('detail').textContent=completed?cfg.reps+' repeticiones terminadas':seg?(seg.type==='prep'?'Prepárate':`Repetición ${seg.round} de ${cfg.reps}`):'Pulsa Iniciar';$('bar').style.width=completed?'100%':seg?Math.min(100,elapsed/(seg.seconds*1000)*100)+'%':'0%';$('start').textContent=running?'Ⅱ Pausar':completed||!seg?'▶ Iniciar':'▶ Continuar';$('footerInfo').textContent=completed?'Sesión finalizada':seg?`Ejercicio ${cfg.work}s · Descanso ${cfg.rest}s · ${cfg.reps} repeticiones`:'Configura los tiempos desde ⚙';$('soundBtn').textContent=$('sound').checked?'♪':'♩'}
function next(){idx++;elapsed=0;lastRemaining=null;if(idx>=segments.length){running=false;completed=true;releaseWake();finishSound()}else{tone(1060,.16)}}
function updateBeep(seg,before,after){const a=Math.ceil(seg.seconds-before/1000),b=Math.ceil(seg.seconds-after/1000);for(let remaining=a-1;remaining>=b;remaining--){if(remaining>=1&&remaining<=3&&lastRemaining!==remaining){lastRemaining=remaining;tone(880,.12)}}}
function tick(now){
 if(!running)return;
 // Tiempo real transcurrido, sin sumar ni duplicar segundos en las transiciones.
 const delta=Math.max(0,now-startedAt);startedAt=now;
 let remainingDelta=delta,guard=0;
 while(running&&guard++<10000){
  const seg=current();if(!seg)break;
  const before=elapsed,ms=seg.seconds*1000;
  const step=Math.min(remainingDelta,Math.max(0,ms-elapsed));
  elapsed+=step;remainingDelta-=step;
  updateBeep(seg,before,elapsed);
  if(elapsed>=ms-0.001){next();if(!running)break;continue}
  break;
 }
 display();if(running)raf=requestAnimationFrame(tick);
}
function start(){ensureAudio();if(running){running=false;cancelAnimationFrame(raf);releaseWake();display();return}if(!current()||completed){build()}running=true;startedAt=performance.now();keepAwake();raf=requestAnimationFrame(tick);display()}function reset(){running=false;cancelAnimationFrame(raf);releaseWake();segments=[];idx=0;elapsed=0;completed=false;cfg=null;display()}function openSettings(){if(running){running=false;cancelAnimationFrame(raf);releaseWake()}updateSummary();settings.classList.add('open');display()}function closeSettings(){settings.classList.remove('open');display()}
$('start').addEventListener('click',start);$('reset').addEventListener('click',reset);$('settingsBtn').addEventListener('click',openSettings);$('closeSettings').addEventListener('click',closeSettings);$('save').addEventListener('click',()=>{persist();reset();closeSettings()});$('soundBtn').addEventListener('click',()=>{$('sound').checked=!$('sound').checked;persist();display()});for(const k of keys)$(k).addEventListener('change',updateSummary);$('sound').addEventListener('change',persist);$('awake').addEventListener('change',persist);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)keepAwake()});updateSummary();display();
})();
</script></body></html>
